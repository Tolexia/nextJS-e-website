name: Check Firebase rules
on:
  pull_request:
jobs:
  check_rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEXTJS_E_WEBSITE }}
      - run: npx -y firebase-tools@latest deploy --only database,storage --project nextjs-e-website --dry-run --non-interactive
