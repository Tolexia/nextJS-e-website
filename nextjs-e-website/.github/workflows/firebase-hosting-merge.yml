name: Deploy Firebase rules
on:
  push:
    branches:
      - main
jobs:
  deploy_rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEXTJS_E_WEBSITE }}
      - run: npx -y firebase-tools@latest deploy --only database,storage --project nextjs-e-website --non-interactive
